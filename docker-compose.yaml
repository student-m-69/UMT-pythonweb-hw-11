services:
  postgres:
    image: postgres:16
    container_name: hw08-postgres
    environment:
      POSTGRES_PASSWORD: hw08secret
      POSTGRES_DB: contacts_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
